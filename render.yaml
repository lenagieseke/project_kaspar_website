# Render Blueprint — defines the web service for https://render.com.
# In the Render dashboard: New → Blueprint → pick this GitHub repo.
# Every push to `main` then triggers a new build and deploy.
services:
  - type: web
    name: kaspar-website
    runtime: node
    plan: free                # free instances sleep after ~15 min idle; first visit then takes ~1 min
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start   # `next start` listens on Render's $PORT automatically
    healthCheckPath: /en
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Needed at build time AND runtime (NEXT_PUBLIC_* values are inlined into the build).
      - key: NEXT_PUBLIC_SANITY_PROJECT_ID
        sync: false           # Render asks for the value when the Blueprint is created
      - key: NEXT_PUBLIC_SANITY_DATASET
        value: production
